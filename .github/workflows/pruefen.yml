# Prüft jeden Pull Request: Selbsttests der Werkzeuge und die Seitenprüfung
# (alt-Texte, Links, keine externen Adressen, keine Metadaten in Bildern ...).
# Lokal dasselbe: bash tools/pruefen.sh
# Offene Platzhalter ("[HIER EINTRAGEN") erscheinen als Warnung, nicht als Fehler.
name: Seite prüfen

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pillow installieren (für die Selbsttests)
        run: python -m pip install pillow

      - name: Prüfungen ausführen
        run: bash tools/pruefen.sh
