<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <script>
    // 404-Seiten werden unter beliebigen Adressen ausgeliefert: Basisadresse setzen,
    // damit relative Pfade stimmen (Projektseite auf github.io: /<Repo>/, sonst /).
    (function () {
      var teile = location.pathname.split("/");
      var basis = location.hostname.slice(-10) === ".github.io" && teile[1] ? "/" + teile[1] + "/" : "/";
      var b = document.createElement("base");
      b.href = basis;
      document.head.insertBefore(b, document.head.firstChild);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seite nicht gefunden</title>
  <meta name="description" content="Diese Seite gibt es nicht.">

  <link rel="stylesheet" href="css/stil.css">

  <link rel="preload" href="inhalt/seite.json" as="fetch" crossorigin>

</head>
